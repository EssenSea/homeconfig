# ############################################################################
                         # AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT
          # IT, OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# ############################################################################

autogenerated = 0 # remove this line to remove the warning

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


								################
								### MONITORS ###
								################

# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor=,preferred,auto,auto
monitor=HDMI-A-1,1920x1080,0x0,1
monitor=eDP-1,1920x1080,1920x0,1
# monitor=eDP-1,disable


							  ###################
							  ### MY PROGRAMS ###
							  ###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = nautilus
$menu = wofi --show drun


							   #################
							   ### AUTOSTART ###
							   #################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
exec-once = waybar -c $HOME/.config/waybar/hypr.jsonc \
                    -s $HOME/.config/waybar/style.css &

exec-once = hyprpaper -c $HOME/.config/hypr/hyprpaper.conf &
# exec-once =  mpvpaper -vs -o "vo=gpu \
#                               gpu-api=vulkan \
#                               hwdec=nvdec,auto-copy \
#                               vulkan-device='NVIDIA GeForce GTX 1060' \
#                               no-audio loop" \
#                               HDMI-A-1 \
#                               ~/Videos/Bmw-M4-Liberty-Walk.mp4
#
# exec-once =  mpvpaper -vs -o "vo=gpu \
#                               gpu-api=vulkan \
#                               hwdec=nvdec,auto-copy \
#                               vulkan-device='NVIDIA GeForce GTX 1060' \
#                               no-audio \
#                               loop" \
#                               eDP-1 \
#                               ~/Videos/Rainy-Day-Train-Station.mp4

exec-once = fcitx5 &
exec-once = mako &
# Clipboard: history
# exec-once = wl-paste --watch cliphist store &
exec-once = wl-paste --type text --watch cliphist store &
exec-once = wl-paste --type image --watch cliphist store &
exec-once = clipman daemon --no-persistent &
exec-once = gentoo-pipewire-launcher &
exec-once = hypridle -c $HOME/.config/hypr/hypridle.conf &
exec-once = hyprsunset &
# exec-once = bash -c "source $HOME/pyvenv/bin/activate && sioyek &"
# exec-once = emacs
# exec-once = /home/moonsea/.cargo/bin/neovide
exec-once = firefox-bin


						 #############################
						 ### ENVIRONMENT VARIABLES ###
						 #############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

env = QT_IM_MODULE, fcitx
env = XMODIFIERS, @im=fcitx
# env = GTK_IM_MODULE, wayland   # Crashes electron apps in xwayland
# env = GTK_IM_MODULE, fcitx     # My Gtk apps no longer require this to work
# with fcitx5 hmm
env = SDL_IM_MODULE, fcitx
env = GLFW_IM_MODULE, ibus
env = INPUT_METHOD, fcitx

# ############ Themes #############
# env = QT_QPA_PLATFORM, wayland
# env = QT_QPA_PLATFORMTHEME, qt5ct
# env = QT_STYLE_OVERRIDE,kvantum
# env = WLR_NO_HARDWARE_CURSORS, 1

# ######## Screen tearing #########
# env = WLR_DRM_NO_ATOMIC, 1

							 #####################
							 ### LOOK AND FEEL ###
							 #####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = 2

    border_size = 4

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info
    # about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders
    # and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you
    # turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    # drop_shadow = true
    # shadow_range = 4
    # shadow_render_power = 3
    # col.shadow = rgba(1a1a1aee)

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = false

    # Default animations, see
    # https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 12, default, slidefade 20%
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
# Master switch for pseudotiling. Enabling is bound to mainMod + P in the
# keybinds section below
    pseudotile = true
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    # Set to 0 or 1 to disable the anime mascot wallpapers
    force_default_wallpaper = 0
    # If true disables the random hyprland logo / anime girl background. :(
    disable_hyprland_logo = true
    background_color = 0x2b3339
}



								 #############
								 ### INPUT ###
								 #############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

cursor {
	no_hardware_cursors =true
}
# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = false
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs
# for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


							  ####################
							  ### KEYBINDINGSS ###
							  ####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, kitty --hold bash -c "tmux new"
# bind = $mainMod, Return, exec, kitty
bind = $mainMod, A, exec, alacritty
bind = $mainMod, T, exec, foot --override shell=fish

bind = $mainMod, Slash, exec, bash -c \
        "cliphist list | fuzzel --dmenu | cliphist decode | wl-copy"

bind = $mainMod, Print, exec, bash -c "slurp | grim -l 0 -g \
        - $HOME/Pictures/Screenshots/$(date +'screenshot_%Y-%m-%d-%H%M%S.png')"

bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, E, exec, wlogout
bind = $mainMod SHIFT, F, fullscreenstate, 0, 3
bind = $mainMod, F, fullscreen

bind = $mainMod, W, exec, firefox-bin
bind = $mainMod, N, exec, hyprlock
bind = $mainMod, V, togglefloating,
bind = $mainMod, D, exec, fuzzel
bind = $mainMod SHIFT, D, exec, rofi -modes drun,run,window -show drun
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod SHIFT, J, togglesplit, # dwindle
# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l # [hidden]
bind = $mainMod, L, movefocus, r # [hidden]
bind = $mainMod, K, movefocus, u # [hidden]
bind = $mainMod, J, movefocus, d # [hidden]

bind = SUPER, Tab, cyclenext,           # change focus to another window
bind = SUPER, Tab, bringactivetotop,    # bring it to the top
bind = Super+Shift, H, movewindow, l # [hidden]
bind = Super+Shift, L, movewindow, r # [hidden]
bind = Super+Shift, J, movewindow, u # [hidden]
bind = Super+Shift, K, movewindow, d # [hidden]

#/# bind = Ctrl+Super, ←/→,, # Workspace: focus left/right
bind = Ctrl+Super, L, workspace, +1 # [hidden]
bind = Ctrl+Super, H, workspace, -1 # [hidden]

bind = Ctrl+Super+Shift, L, movetoworkspace, +1 # [hidden]
bind = Ctrl+Super+Shift, H, movetoworkspace, -1 # [hidden]
# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindl =, XF86AudioMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle # [hidden]
bindl =, XF86AudioMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle # [hidden]
bindl =, XF86AudioMute, exec, \
          wpctl set-volume @DEFAULT_AUDIO_SINK@ 0% # [hidden]
bindle=, XF86AudioRaiseVolume, exec, \
          wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ # [hidden]
bindle=, XF86AudioLowerVolume, exec, \
          wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- # [hidden]

# will switch to a submap called resize
# bind = ALT, R, submap, resize

# will start a submap called "resize"
# submap = resize

# sets repeatable binds for resizing the active window
binde = $mainMod Alt, L, resizeactive, 10 0
binde = $mainMod Alt, H, resizeactive, -10 0
binde = $mainMod Alt, J, resizeactive, 0 -10
binde = $mainMod Alt, K, resizeactive, 0 10

# use reset to go back to the global submap
# bind = , escape, submap, reset

# will reset the submap, which will return to the global submap
# submap = reset

# keybinds further down will be global again...
						 ##############################
						 ### WINDOWS AND WORKSPACES ###
						 ##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace
# rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.
# windowrulev2 = fullscreenstate, 1, 3, \
#                class:^(firefox-bin)$, title:^(firefox-bin)$

workspace = r[1,2,3,4,5], monitor:HDMI-A-1
workspace = r[6,7,8,9], monitor:eDP-1
workspace = 1, monitor:HDMI-A-1, default:true
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:eDP-1
workspace = 7, monitor:eDP-1
workspace = 8, monitor:eDP-1
workspace = 9, monitor:eDP-1
