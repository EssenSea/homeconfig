[main]
font=Sarasa Mono Slab SC:weight=bold:style=oblique:slant=Roman:size=18
dpi-aware=yes
terminal=kitty -e
prompt="~> "
layer=overlay
width=50
lines=8
line-height=26
hide-before-typing=no
horizontal-pad=20
vertical-pad=10
inner-pad=0
# namespace=launcher
use-bold=yes
minimal-lines=yes

[colors]
background=2e3339b0
text=d3c6aaff
prompt=d3c6aaff
input=d3c6aaff
selection=a7c08080
selection-text=d3c6aaff
border=a7c080ff
match=7fbbb3ff
selection-match=7fbbb3ff


[border]
radius=20
width=5
selection-radius=10

[dmenu]
exit-immediately-if-empty=yes
